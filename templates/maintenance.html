<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Maintenance • Tickr</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='media/ndmu_logo.png') }}">
    <!-- Typography: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <style>
        body {
            background: radial-gradient(circle at 50% 0%, #fffbeb 0%, #f8fafc 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: #0f172a;
        }
        .maintenance-card {
            background: #ffffff;
            border: 1px solid #fde68a;
            border-radius: 16px;
            padding: 2.5rem 2rem;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(217, 119, 6, 0.08);
        }
        .maintenance-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background-color: #fef3c7;
            color: #d97706;
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.25rem;
            border: 2px solid #fde68a;
        }
    </style>
</head>

<body>
    <div class="maintenance-card">
        <div class="maintenance-icon">
            <i class="bi bi-tools"></i>
        </div>
        <h1 class="h4 fw-bold text-dark mb-2">System Maintenance Underway</h1>
        <p class="text-muted small mb-4">
            Tickr is currently undergoing scheduled database maintenance or server optimization. Attendance logging and admin functions will resume shortly.
        </p>
        <div class="d-flex justify-content-center gap-2">
            <button class="btn btn-primary px-4" onclick="window.location.reload();">
                <i class="bi bi-arrow-clockwise me-1"></i> Try Again
            </button>
            <a class="btn btn-outline-secondary px-4" href="/">
                <i class="bi bi-house me-1"></i> Return Home
            </a>
        </div>
        <div class="mt-4 pt-3 border-top">
            <small class="text-muted">Notre Dame of Marbel University • Computer Center</small>
        </div>
    </div>
</body>

</html>
