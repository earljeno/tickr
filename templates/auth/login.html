<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login • Tickr</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='media/ndmu_logo.png') }}">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <!-- Design System Theme & Login Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}" />
</head>

<body>
    <div class="login-wrapper">
        <div class="login-card">
            <!-- Brand Header -->
            <div class="login-brand text-center">
                <div class="brand-logo-wrapper mb-2">
                    <img src="{{ url_for('static', filename='media/ndmu_logo.png') }}" alt="NDMU Logo" class="brand-logo">
                </div>
                <h1 class="brand-name">Tickr</h1>
                <p class="brand-dept mb-0">NDMU Computer Center</p>
            </div>

            <!-- Student Assistant (GIA) View - Primary Focus -->
            <div id="giaViewSection">
                <div class="portal-badge-container text-center mb-4">
                    <span class="portal-badge">Student Assistant Portal</span>
                    <p class="portal-description mt-2 mb-0">Enter your School ID to clock in and manage your DTR</p>
                </div>

                <form id="employeeForm" novalidate>
                    <div class="mb-4">
                        <label for="giaId" class="form-label d-flex justify-content-between align-items-center">
                            <span>School ID Number</span>
                            <span class="text-muted small fw-normal">e.g. 2024001</span>
                        </label>
                        <input type="tel" 
                               class="form-control form-control-lg font-mono" 
                               id="giaId" 
                               placeholder="Enter ID number..." 
                               autocomplete="username" 
                               required 
                               autofocus />
                        <div class="error-text" id="giaError"></div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 btn-submit-login">
                        Sign In to Dashboard
                    </button>
                </form>

                <!-- Subtle, Low-Focus Admin Access Link -->
                <div class="admin-access-footer mt-4 pt-3 border-top text-center">
                    <button type="button" class="btn btn-sm btn-link admin-switch-btn text-decoration-none" id="toAdminBtn">
                        Administrator Login
                    </button>
                </div>
            </div>

            <!-- Administrator View - Secondary/Hidden by Default -->
            <div id="adminViewSection" class="d-none">
                <div class="portal-badge-container text-center mb-4">
                    <span class="portal-badge admin-badge">Administrator Console</span>
                    <p class="portal-description mt-2 mb-0">Authorized Computer Center personnel only</p>
                </div>

                <form id="adminForm" novalidate>
                    <div class="mb-3">
                        <label for="adminId" class="form-label">Admin Username</label>
                        <input type="text" 
                               class="form-control" 
                               id="adminId" 
                               placeholder="Enter username" 
                               autocomplete="username" 
                               required />
                    </div>

                    <div class="mb-4">
                        <label for="adminPassword" class="form-label">Password</label>
                        <div class="input-group">
                            <input type="password" 
                                   class="form-control" 
                                   id="adminPassword" 
                                   placeholder="Enter password" 
                                   autocomplete="current-password" 
                                   required />
                            <button class="btn btn-outline-secondary px-3" 
                                    type="button" 
                                    id="toggleAdminPassword" 
                                    aria-label="Toggle password visibility">
                                Show
                            </button>
                        </div>
                        <div class="error-text" id="adminError"></div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 btn-submit-login mb-3">
                        Sign In as Admin
                    </button>

                    <div class="text-center">
                        <button type="button" class="btn btn-sm btn-link text-decoration-none text-muted" id="toGiaBtn">
                            &larr; Return to Student Assistant Login
                        </button>
                    </div>
                </form>
            </div>

            <!-- Legacy compatible elements (for backwards-compatibility) -->
            <div class="d-none" aria-hidden="true">
                <button type="button" id="tabGia"></button>
                <button type="button" id="tabAdmin"></button>
                <span id="loginTitle"></span>
                <span id="toggleText"></span>
                <a href="#" id="toggleLink"></a>
            </div>
        </div>

        <div class="login-institutional-footer text-center mt-3">
            <span>Notre Dame of Marbel University • Computer Center</span>
            <div class="small text-muted mt-0.5">Daily Time Record & Attendance System</div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>

</html>
